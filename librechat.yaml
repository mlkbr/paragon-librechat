version: 1.3.0
cache: true

interface:
  privacyPolicy:
    externalUrl: "https://openrouter.ai/privacy"
    openNewTab: true
  termsOfService:
    externalUrl: "https://openrouter.ai/terms"
    openNewTab: true
    modalAcceptance: false

endpoints:
  custom:
    - name: "OpenRouter"
      apiKey: "${OPENROUTER_KEY}"
      baseURL: "https://openrouter.ai/api/v1"
      models:
        default:
          - "anthropic/claude-sonnet-4.5"
          - "anthropic/claude-opus-4"
          - "openai/gpt-5"
          - "openai/gpt-4o"
          - "openai/gpt-4o-mini"
          - "google/gemini-2.5-pro"
          - "meta-llama/llama-3.3-70b-instruct"
        fetch: true
      titleConvo: true
      titleModel: "openai/gpt-4o-mini"
      summarize: false
      summaryModel: "openai/gpt-4o-mini"
      forcePrompt: false
      modelDisplayLabel: "OpenRouter"
      iconURL: "https://openrouter.ai/favicon.ico"
